# GalIOS runtime: OneiOS's runtime (xnuhost and the phone-side tools) built from OneiOS's main with OneiOS's own release
# steps (NDK, drm2kgsl for the 3D GPU), so it matches the kernel GalIOS builds from the same main: the newest Wi-Fi,
# audio, USB and GPU host fixes are there before OneiOS publishes a release. It is attached to the newest GalIOS GPU
# pack release (galios-gpu-*), where GalIOS Studio looks for it first. OneiOS's own code only: no Apple file.
name: GalIOS runtime
on:
  push:
    branches: [ccr-a2c53c06-k8pnxp]
    paths: ['.github/workflows/galios-runtime.yml', 'GalIOS/gpu/ONEIOS_REF', 'GalIOS/runtime/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: galios-runtime
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            GalIOS/gpu
            GalIOS/runtime
      - name: OneiOS
        run: |
          ref=$(cat GalIOS/gpu/ONEIOS_REF 2>/dev/null | tr -d ' \n' || true)
          git clone -q https://github.com/akshaynexus/OneiOS.git
          [ -z "$ref" ] || git -C OneiOS checkout -q "$ref"
          git -C OneiOS log -1 --format='OneiOS %H %cd %s'
      - name: NDK, Rust target and oneios-tool (OneiOS's setup-build.sh)
        run: cd OneiOS && .github/scripts/setup-build.sh
      - name: drm2kgsl's sources (the 3D GPU path)
        run: |
          cd OneiOS && scripts/setup/get-references.sh virglrenderer
          test -f external/virglrenderer/src/drm/drm2kgsl/drm2kgsl_renderer.c
      - name: GalIOS's runtime fixes (GalIOS/runtime/patches; each skipped once OneiOS has it)
        run: |
          cd OneiOS
          for p in "$GITHUB_WORKSPACE"/GalIOS/runtime/patches/*.patch; do
            n=$(basename "$p")
            case "$n" in
              0001-fence-table.patch)
                if grep -q 'virgl_fence_table_init' runtime/xnuhost/src/*.c; then echo "$n: OneiOS already makes the fence table"; continue; fi ;;
            esac
            if git apply -R --check "$p" 2>/dev/null; then echo "$n: OneiOS has it already"; continue; fi
            git apply --verbose "$p"
            echo "applied $n"
          done
          git diff --stat
      - name: Package
        run: |
          cd OneiOS
          v=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//'); v=${v:-0.1.8}
          echo "VERSION=$v-galios.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          runtime/package.sh "$v-galios.${GITHUB_RUN_NUMBER}"
          ls -la out/release
      - name: xnuhost and gpuctl have drm2kgsl
        run: |
          d=$(mktemp -d); zstd -dc OneiOS/out/release/oneios-runtime-$VERSION-arm64.tar.zst | tar -x -C "$d"
          for b in bin/xnuhost bin/gpuctl; do ! strings "$d/$b" | grep -q 'this build has no drm2kgsl'; done
          # the fence table is made (GalIOS/runtime/patches/0001, or OneiOS's own fix)
          grep -q 'virgl_fence_table_init' OneiOS/runtime/xnuhost/src/*.c
          # GalIOS's fixes are in this source (GalIOS/runtime/patches)
          grep -q 'place_watch_start' OneiOS/runtime/xnuhost/src/main.c
          grep -q 'key_fallback' OneiOS/runtime/bridges/brightness/brightness.c
          grep -q 'bottom_remap' OneiOS/runtime/bridges/brightness/brightness.c
          strings "$d/bin/xnuhost" | grep -q 'oneios-hid-buttons-builtin=1'
          test -f OneiOS/runtime/xnuhost/drm2kgsl/patches/0008-galios-xnuhost-vcpu-names.patch
          grep -q 'XH_RAM_SESSION_RESERVE (2ull << 30)' OneiOS/runtime/xnuhost/src/xnuhost.h
          strings "$d/bin/xnuhost" | grep -q 'oneios-actuator=0'
          # the display helper must load in app_process: every symbol it uses from a library it names (OneiOS f7bb1c3:
          # without libnativewindow the panel stayed on the OneOS splash while iOS drew)
          so=$(find "$d" -name liboneios-display.so | head -1); test -n "$so"
          readelf -d "$so" | grep NEEDED
          for sym in $(readelf --dyn-syms -W "$so" | awk '$7=="UND" && $8!="" {print $8}' | sed 's/@.*//' | grep '^ANativeWindow_'); do
            readelf -d "$so" | grep -q 'libnativewindow.so\|libandroid.so' || { echo "no library for $sym"; exit 1; }
          done
          case "$(readelf --dyn-syms -W "$so")" in *ANativeWindow_getBuffersDataSpace*) readelf -d "$so" | grep -q libnativewindow.so || { echo "liboneios-display.so uses the dataspace calls without libnativewindow: app_process cannot load it"; exit 1; } ;; esac
      - uses: actions/upload-artifact@v4
        with:
          name: galios-runtime
          path: |
            OneiOS/out/release/oneios-runtime-*.tar.zst
            OneiOS/out/release/oneios-runtime-*.tar.zst.sha256
      - name: Attach to the newest GPU pack release (waits for it, up to 75 minutes)
        run: |
          for i in $(seq 75); do
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 40 --json tagName --jq '[.[] | select(.tagName | startswith("galios-gpu-"))][0].tagName')
            [ -n "$tag" ] && break
            sleep 60
          done
          [ -n "$tag" ] || { echo "no GPU pack release yet: the runtime stays an artifact of this run"; exit 0; }
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            OneiOS/out/release/oneios-runtime-$VERSION-arm64.tar.zst OneiOS/out/release/oneios-runtime-$VERSION-arm64.tar.zst.sha256
          # only this runtime stays on the release, so Studio cannot pick an older one
          for old in $(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); do
            case "$old" in
              oneios-runtime-$VERSION-arm64*) ;;
              oneios-runtime-*) gh release delete-asset "$tag" "$old" --repo "$GITHUB_REPOSITORY" -y && echo "removed the older $old" ;;
            esac
          done
          echo "attached oneios-runtime-$VERSION to $tag"
