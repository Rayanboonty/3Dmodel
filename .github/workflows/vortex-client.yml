name: Vortex Client

on:
  push:
    paths:
      - "vortex-client/**"
      - ".github/workflows/vortex-client.yml"
  pull_request:
    paths:
      - "vortex-client/**"
      - ".github/workflows/vortex-client.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: vortex-client

jobs:
  windows:
    name: Windows x64 build + smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vortex-client

      - name: Unit tests
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release --workspace

      - name: Smoke test against Mojang's real servers
        shell: pwsh
        env:
          VORTEX_HOME: ${{ runner.temp }}\vortex-home
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $cli = ".\target\release\vortex-cli.exe"
          & $cli versions --limit 5
          & $cli install 1.8.9
          & $cli launch 1.8.9 --offline Tester --dry-run
          & $cli launch b1.7.3 --offline Tester --dry-run
          & $cli launch 1.21.4 --fabric --offline Tester --dry-run

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\vortex.exe dist\Vortex.exe
          Copy-Item target\release\vortex-cli.exe dist\vortex-cli.exe
          Copy-Item README.md dist\README.md

      - uses: actions/upload-artifact@v4
        with:
          name: Vortex-windows-x64
          path: vortex-client/dist

  linux:
    name: Linux tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vortex-client
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
