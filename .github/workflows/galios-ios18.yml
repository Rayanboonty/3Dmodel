# GalaxyIOS iOS 18, stage 0 (GalIOS/ios18/PLAN.md): the kernel porting matrix, built on GitHub. Apple's published
# xnu-11417 source (iPadOS/iOS 18), UniXNU-y2q's iPadOS 18 board layer, and OneiOS's kernel patches at the pinned
# OneiOS (GalIOS/gpu/ONEIOS_REF): which of them carry over to iOS 18's kernel and which must be ported. Source only:
# no Apple firmware is fetched. The report is the run's summary and the artifact ios18-porting-matrix.
name: GalaxyIOS iOS 18 kernel
on:
  push:
    branches: [ccr-a2c53c06-k8pnxp]
    paths: ['.github/workflows/galios-ios18.yml', 'GalIOS/ios18/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  porting-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            GalIOS/ios18
            GalIOS/gpu
      - name: Sources (XNU 11417, OneiOS, UniXNU-y2q)
        run: |
          set -u
          tag=xnu-11417.140.69
          git ls-remote --tags https://github.com/apple-oss-distributions/xnu.git "refs/tags/$tag" | grep -q . || \
            tag=$(git ls-remote --tags https://github.com/apple-oss-distributions/xnu.git 'refs/tags/xnu-11417.*' | sed 's|.*refs/tags/||; s|\^{}||' | sort -uV | tail -n 1)
          echo "XNU tag: $tag"
          git -c advice.detachedHead=false clone -q --depth 1 --branch "$tag" https://github.com/apple-oss-distributions/xnu.git xnu18
          ref=$(tr -d ' \n' < GalIOS/gpu/ONEIOS_REF 2>/dev/null || true)
          git clone -q --filter=blob:none --no-checkout https://github.com/akshaynexus/OneiOS.git OneiOS
          git -C OneiOS sparse-checkout set kernel/patches kernel/device/patches
          git -C OneiOS -c advice.detachedHead=false checkout -q ${ref:-HEAD}
          git clone -q --depth 1 https://github.com/kmu1757/UniXNU-y2q.git y2q || echo "::warning::UniXNU-y2q not reachable: the board layer is left out of this run"
      - name: Porting matrix
        run: |
          mkdir -p out/rejects
          REJECTS="$PWD/out/rejects" bash GalIOS/ios18/porting-matrix.sh xnu18 OneiOS y2q > ios18-porting-matrix.md
          cp ios18-porting-matrix.md out/
          # the tree as far as it got: every patch's fitting hunks on xnu-11417, as one diff against Apple's source
          git -C xnu18 diff "$(git -C xnu18 rev-list --max-parents=0 HEAD)" HEAD > out/xnu-11417-galaxyios-stage1.diff
          ls out/rejects | wc -l
          cat ios18-porting-matrix.md >> "$GITHUB_STEP_SUMMARY"
          tail -n 8 ios18-porting-matrix.md
      - uses: actions/upload-artifact@v4
        with:
          name: ios18-porting-matrix
          path: out

  # iOS 16 (the owner's ask, 2026-11-15): Apple's xnu-8796 (iOS 16) and ios-sweet's board layer, the one the Galaxy S9's
  # iOS 16 port (ios-s9) is built on, under the same hosted layer. Bare-metal iOS 16 needs an unlocked bootloader; this
  # measures what running it beside Android would take, as for iOS 18.
  ios16-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            GalIOS/ios18
            GalIOS/gpu
      - name: Sources (XNU 8796, OneiOS, ios-sweet)
        run: |
          set -u
          tag=$(git ls-remote --tags https://github.com/apple-oss-distributions/xnu.git 'refs/tags/xnu-8796.*' | sed 's|.*refs/tags/||; s|\^{}||' | sort -uV | tail -n 1)
          echo "XNU tag: $tag"
          git -c advice.detachedHead=false clone -q --depth 1 --branch "$tag" https://github.com/apple-oss-distributions/xnu.git xnu16
          ref=$(tr -d ' \n' < GalIOS/gpu/ONEIOS_REF 2>/dev/null || true)
          git clone -q --filter=blob:none --no-checkout https://github.com/akshaynexus/OneiOS.git OneiOS
          git -C OneiOS sparse-checkout set kernel/patches kernel/device/patches
          git -C OneiOS -c advice.detachedHead=false checkout -q ${ref:-HEAD}
          git clone -q --depth 1 https://github.com/dipa-studio/ios-sweet.git sweet || echo "::warning::ios-sweet not reachable"
      - name: Porting matrix
        run: |
          mkdir -p out/rejects
          TARGET_NAME="iOS 16" BOARD_NAME="ios-sweet, iOS 16.7.16" BOARD_DIR=xnu/patches REJECTS="$PWD/out/rejects" \
            bash GalIOS/ios18/porting-matrix.sh xnu16 OneiOS sweet > ios16-porting-matrix.md
          cp ios16-porting-matrix.md out/
          git -C xnu16 diff "$(git -C xnu16 rev-list --max-parents=0 HEAD)" HEAD > out/xnu-8796-galaxyios-stage1.diff
          cat ios16-porting-matrix.md >> "$GITHUB_STEP_SUMMARY"
          tail -n 8 ios16-porting-matrix.md
      - uses: actions/upload-artifact@v4
        with:
          name: ios16-porting-matrix
          path: out