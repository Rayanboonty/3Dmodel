name: Vortex Client release

# Every installed launcher (Windows and Android) updates itself from the
# newest GitHub release tagged vortex-v<version>.
#
# Publishing is automatic: when a new `version` in vortex-client/Cargo.toml
# lands on the release branch, this builds Windows x64 and the Android APKs
# and publishes them as release vortex-v<version>. Pushes that don't change
# the version publish nothing. A tag push (vortex-v0.6.0) or a manual run
# works too. The release text (shown in the update pop-up) comes from
# vortex-client/RELEASE_NOTES.md.

on:
  push:
    branches:
      - claude/vortex-minecraft-client-xxro99
    paths:
      - vortex-client/Cargo.toml
      - vortex-client/RELEASE_NOTES.md
      - .github/workflows/vortex-release.yml
      - vortex-client/android/build.sh
      - vortex-client/android/apply.py
    tags:
      - "vortex-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example vortex-v0.6.0); empty means the version in Cargo.toml"
        required: false

permissions:
  contents: write

defaults:
  run:
    working-directory: vortex-client

concurrency:
  group: vortex-release
  cancel-in-progress: false

jobs:
  plan:
    name: Which version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      go: ${{ steps.v.outputs.go }}
      android: ${{ steps.v.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          conf=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' crates/vortex-app/tauri.conf.json | head -1)
          if [ "$version" != "$conf" ]; then echo "tauri.conf.json says $conf, Cargo.toml says $version"; exit 1; fi
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then tag="${{ github.ref_name }}"; else tag="vortex-v$version"; fi
          fi
          if [ "$tag" != "vortex-v$version" ]; then echo "Tag $tag doesn't match version $version"; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Already published: nothing to do (a push that didn't change the version).
          if assets=$(gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null); then
            echo "$tag is already released"
            echo "go=false" >> "$GITHUB_OUTPUT"
            # Its Android APKs can still be missing (a failed Android build).
            if echo "$assets" | grep -q '^Vortex-Client-android-universal.apk$'; then
              echo "android=false" >> "$GITHUB_OUTPUT"
            else
              echo "Adding the Android APKs to $tag"
              echo "android=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Releasing $tag"
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "android=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Windows build and publish
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vortex-client

      - name: Unit tests
        run: cargo test --workspace

      - name: Build
        run: cargo build --release -p vortex-app -p vortex-cli

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\Vortex | Out-Null
          Copy-Item target\release\vortex.exe dist\Vortex\Vortex.exe
          Copy-Item target\release\vortex-cli.exe dist\Vortex\vortex-cli.exe
          Copy-Item crates\vortex-app\resources\vortex-mods.jar dist\Vortex\vortex-mods-1.0.0.jar
          Copy-Item crates\vortex-app\ui\fonts\OFL-*.txt dist\Vortex\
          Copy-Item README.md dist\Vortex\README.md
          $loader = Get-ChildItem -Recurse -Filter WebView2Loader.dll target\release -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($loader) { Copy-Item $loader.FullName dist\Vortex\ }
          Compress-Archive -Path dist\Vortex -DestinationPath dist\Vortex-windows-x64.zip -Force

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Vortex Client ${{ needs.plan.outputs.tag }}
          body_path: vortex-client/RELEASE_NOTES.md
          make_latest: true
          files: vortex-client/dist/Vortex-windows-x64.zip

  android:
    name: Android APKs
    needs: [plan, release]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.android == 'true' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
      - name: Android SDK and NDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.3.13750724" > /dev/null
      - name: Build (Amethyst + the Vortex overlay)
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          export JDK_PATHS="$JAVA_HOME_8_X64,$JAVA_HOME_21_X64"
          bash android/build.sh
          ls -la android/out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          files: vortex-client/android/out/*.apk
