name: Vortex Client release

# Every installed launcher updates itself from the newest GitHub release
# tagged vortex-v<version>.
#
# Publishing is automatic: when a new `version` in vortex-client/Cargo.toml
# lands on the release branch, this builds Windows x64 and publishes it as
# release vortex-v<version>. Pushes that don't change
# the version publish nothing. A tag push (vortex-v0.6.0) or a manual run
# works too. The release text (shown in the update pop-up) comes from
# vortex-client/RELEASE_NOTES.md.

on:
  push:
    branches:
      - claude/vortex-minecraft-client-xxro99
    paths:
      - vortex-client/Cargo.toml
      - vortex-client/RELEASE_NOTES.md
      - .github/workflows/vortex-release.yml
    tags:
      - "vortex-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example vortex-v0.6.0); empty means the version in Cargo.toml"
        required: false

permissions:
  contents: write

defaults:
  run:
    working-directory: vortex-client

concurrency:
  group: vortex-release
  cancel-in-progress: false

jobs:
  plan:
    name: Which version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      go: ${{ steps.v.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          conf=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' crates/vortex-app/tauri.conf.json | head -1)
          if [ "$version" != "$conf" ]; then echo "tauri.conf.json says $conf, Cargo.toml says $version"; exit 1; fi
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then tag="${{ github.ref_name }}"; else tag="vortex-v$version"; fi
          fi
          if [ "$tag" != "vortex-v$version" ]; then echo "Tag $tag doesn't match version $version"; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Already published: nothing to do (a push that didn't change the version).
          if gh release view "$tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "$tag is already released"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $tag"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Windows build and publish
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vortex-client

      - name: Unit tests
        run: cargo test --workspace

      - name: Build
        run: cargo build --release -p vortex-app -p vortex-cli

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\Vortex | Out-Null
          Copy-Item target\release\vortex.exe dist\Vortex\Vortex.exe
          Copy-Item target\release\vortex-cli.exe dist\Vortex\vortex-cli.exe
          Copy-Item crates\vortex-app\resources\vortex-mods-*.jar dist\Vortex\ 
          Copy-Item crates\vortex-app\ui\fonts\OFL-*.txt dist\Vortex\
          Copy-Item README.md dist\Vortex\README.md
          $loader = Get-ChildItem -Recurse -Filter WebView2Loader.dll target\release -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($loader) { Copy-Item $loader.FullName dist\Vortex\ }
          Compress-Archive -Path dist\Vortex -DestinationPath dist\Vortex-windows-x64.zip -Force
          # The launcher on its own: the WebView2 loader is linked in (MSVC)
          # and the Vortex mods are built in, so it's a single file.
          Copy-Item target\release\vortex.exe dist\Vortex.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Vortex Client ${{ needs.plan.outputs.tag }}
          body_path: vortex-client/RELEASE_NOTES.md
          make_latest: true
          files: |
            vortex-client/dist/Vortex.exe
            vortex-client/dist/Vortex-windows-x64.zip
