<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vortex Client</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/extra.css">
</head>
<body class="phase-dawn">
  <div class="backdrop" aria-hidden="true"></div>
  <canvas id="world" aria-hidden="true"></canvas>
  <div id="player-layer"></div>

  <div id="boot" class="boot" role="status" aria-live="polite">
    <div class="boot-inner">
      <img class="boot-logo" id="boot-logo" src="img/logo.png" alt="Vortex Client" height="150">
      <div class="bar"><i></i></div>
      <div class="boot-hint" id="boot-hint">Starting</div>
    </div>
  </div>

  <div class="app" id="app">
    <header class="topbar">
      <div class="brand" role="img" aria-label="Vortex Client"><img class="brand-logo" id="brand-logo" src="img/logo.png" alt="" height="34"><span class="brand-name">VORTEX<b>CLIENT</b></span><span class="brand-ver" id="brand-ver"></span></div>
      <div class="top-right">
        <button class="glass top-chip time-chip lq hl" id="time-chip" aria-label="Time of day" hidden><span data-icon="sun" data-size="16" id="time-icon"></span><span class="time" id="time-text">06:00</span><span class="phase" id="phase-text">Dawn</span></button>
        <button class="glass top-chip rec-chip lq hl" id="rec-chip" aria-label="Start recording (F12 in-game)"><span class="rec-dot" aria-hidden="true"></span><span id="rec-time">Record</span></button>
        <button class="glass top-chip lq hl" id="theme-toggle" aria-label="Switch to light mode"><span data-icon="sun" data-size="16"></span></button>
        <button class="glass top-chip lq hl" id="log-toggle" aria-label="Game log (Ctrl+L)"><span data-icon="log" data-size="16"></span><span class="log-badge" id="log-badge" hidden></span></button>
        <button class="glass top-chip lq hl" id="account-chip"><canvas class="avatar" width="8" height="8" id="account-avatar"></canvas><span id="account-name">No account</span></button>
      </div>
    </header>
    <nav class="sidebar tabs vertical" id="nav" aria-label="Main">
      <span class="drop" aria-hidden="true"></span>
      <button class="tab" data-route="home"><span data-icon="play" data-size="18"></span><span class="tab-label">Play</span></button>
      <button class="tab" data-route="instances"><span data-icon="grid" data-size="18"></span><span class="tab-label">Instances</span></button>
      <button class="tab" data-route="mods"><span data-icon="puzzle" data-size="18"></span><span class="tab-label">Mods</span></button>
      <button class="tab" data-route="skins"><span data-icon="shirt" data-size="18"></span><span class="tab-label">Skins</span></button>
      <button class="tab" data-route="music"><span data-icon="music" data-size="18"></span><span class="tab-label">Music</span></button>
      <button class="tab" data-route="host"><span data-icon="server" data-size="18"></span><span class="tab-label">Host</span></button>
      <button class="tab" data-route="accounts"><span data-icon="user" data-size="18"></span><span class="tab-label">Accounts</span></button>
      <button class="tab" data-route="settings"><span data-icon="gear" data-size="18"></span><span class="tab-label">Settings</span></button>
      <span class="side-version" id="side-version"></span>
    </nav>
    <div class="mini-player" id="mini-player" hidden>
        <button class="btn btn-sm btn-icon btn-ghost" id="mp-toggle" aria-label="Play or pause"><span data-icon="pause" data-size="12"></span></button>
        <div class="mp-text" id="mp-open" role="button" tabindex="0"><strong id="mp-title"></strong><span id="mp-artist"></span></div>
        <button class="btn btn-sm btn-icon btn-ghost" id="mp-next" aria-label="Next"><span data-icon="next" data-size="12"></span></button>
      </div>
    <main class="page" id="page"></main>
  </div>

  <section class="glass log-dock" id="log" aria-label="Game log">
    <div class="log-head">
      <span class="title">Game log</span>
      <select id="log-instance" aria-label="Instance"></select>
      <div class="tabs sm" id="log-filter" role="group" aria-label="Filter">
        <span class="drop" aria-hidden="true"></span>
        <button class="tab on" data-level="all">All</button>
        <button class="tab" data-level="warn">Warnings</button>
        <button class="tab" data-level="error">Errors</button>
      </div>
      <span class="grow"></span>
      <input id="log-search" type="search" placeholder="Search" aria-label="Search log">
      <button class="btn btn-sm btn-icon btn-ghost lq" id="log-copy" aria-label="Copy log"><span data-icon="copy" data-size="14"></span></button>
      <button class="btn btn-sm btn-icon btn-ghost lq" id="log-clear" aria-label="Clear log"><span data-icon="trash" data-size="14"></span></button>
      <button class="btn btn-sm btn-icon btn-ghost lq" id="log-close" aria-label="Close log"><span data-icon="x" data-size="14"></span></button>
    </div>
    <div class="log-body" id="log-body"></div>
  </section>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal-root" id="modal-root"></div>
  <div id="popover-root"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <script type="module" src="js/app.js"></script>
</body>
</html>
