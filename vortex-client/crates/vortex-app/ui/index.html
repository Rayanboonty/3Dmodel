<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vortex Client</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="phase-dawn">
  <canvas id="world" aria-hidden="true"></canvas>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <filter id="lg-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.007 0.011" numOctaves="2" seed="5" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2.5" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="34" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="lg-refract-soft" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.008" numOctaves="1" seed="9" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="3" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="lg-lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.05" numOctaves="1" seed="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <div id="player-layer"></div>

  <div id="boot" class="boot" role="status" aria-live="polite">
    <div class="boot-inner">
      <img class="boot-logo" id="boot-logo" src="img/logo.png" alt="Vortex Client" height="150">
      <div class="bar"><i></i></div>
      <div class="boot-hint" id="boot-hint">Starting</div>
    </div>
  </div>

  <div class="app" id="app">
    <header class="topbar">
      <div class="brand" role="img" aria-label="Vortex Client"><img class="brand-logo" id="brand-logo" src="img/logo.png" alt="" height="40"></div>
      <nav class="glass nav tabs hl" id="nav" aria-label="Main">
        <span class="drop" aria-hidden="true"></span>
        <button class="tab" data-route="home"><span data-icon="home" data-size="14"></span><span class="tab-label">Home</span></button>
        <button class="tab" data-route="instances"><span data-icon="grid" data-size="14"></span><span class="tab-label">Instances</span></button>
        <button class="tab" data-route="mods"><span data-icon="puzzle" data-size="14"></span><span class="tab-label">Mods</span></button>
        <button class="tab" data-route="skins"><span data-icon="shirt" data-size="14"></span><span class="tab-label">Skins</span></button>
        <button class="tab" data-route="settings"><span data-icon="gear" data-size="14"></span><span class="tab-label">Settings</span></button>
      </nav>
      <div class="top-right">
        <button class="glass top-chip time-chip lq hl" id="time-chip" aria-label="Time of day"><span data-icon="sun" data-size="16" id="time-icon"></span><span class="time" id="time-text">06:00</span><span class="phase" id="phase-text">Dawn</span></button>
        <button class="glass top-chip lq hl" id="log-toggle" aria-label="Game log (Ctrl+L)"><span data-icon="log" data-size="16"></span><span class="log-badge" id="log-badge" hidden></span></button>
        <button class="glass top-chip lq hl" id="account-chip"><canvas class="avatar" width="8" height="8" id="account-avatar"></canvas><span id="account-name">No account</span></button>
      </div>
    </header>
    <main class="page" id="page"></main>
  </div>

  <section class="glass log-dock" id="log" aria-label="Game log">
    <div class="log-head">
      <span class="title">Game log</span>
      <select id="log-instance" aria-label="Instance"></select>
      <div class="tabs sm" id="log-filter" role="group" aria-label="Filter">
        <span class="drop" aria-hidden="true"></span>
        <button class="tab on" data-level="all">All</button>
        <button class="tab" data-level="warn">Warnings</button>
        <button class="tab" data-level="error">Errors</button>
      </div>
      <span class="grow"></span>
      <input id="log-search" type="search" placeholder="Search" aria-label="Search log">
      <button class="btn btn-sm btn-icon btn-ghost lq" id="log-copy" aria-label="Copy log"><span data-icon="copy" data-size="14"></span></button>
      <button class="btn btn-sm btn-icon btn-ghost lq" id="log-clear" aria-label="Clear log"><span data-icon="trash" data-size="14"></span></button>
      <button class="btn btn-sm btn-icon btn-ghost lq" id="log-close" aria-label="Close log"><span data-icon="x" data-size="14"></span></button>
    </div>
    <div class="log-body" id="log-body"></div>
  </section>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal-root" id="modal-root"></div>
  <div id="popover-root"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <script type="module" src="js/app.js"></script>
</body>
</html>
