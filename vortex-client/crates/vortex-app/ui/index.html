<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vortex</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="phase-dawn booting">
  <canvas id="sky" aria-hidden="true"></canvas>

  <div id="boot" class="boot" role="status" aria-live="polite">
    <div class="boot-inner">
      <div class="boot-logo"><span class="boot-v">V</span>ORTEX</div>
      <div class="boot-splash" id="boot-splash">Waking up the sun…</div>
      <div class="xp boot-bar"><div class="xp-fill" id="boot-fill"></div></div>
      <div class="boot-hint" id="boot-hint">Loading</div>
    </div>
  </div>

  <div class="app" id="app">
    <aside class="rail" aria-label="Main navigation">
      <div class="brand">
        <span class="brand-icon" data-icon="logo"></span>
        <span class="brand-text">VORTEX</span>
        <span class="splash" id="splash"></span>
      </div>
      <nav class="nav" id="nav">
        <span class="nav-marker" id="nav-marker" aria-hidden="true"></span>
        <button class="nav-btn" data-route="home"><span data-icon="home"></span><span>Home</span></button>
        <button class="nav-btn" data-route="instances"><span data-icon="grid"></span><span>Instances</span></button>
        <button class="nav-btn" data-route="new"><span data-icon="plus"></span><span>New</span></button>
        <button class="nav-btn" data-route="mods"><span data-icon="puzzle"></span><span>Mods</span></button>
        <button class="nav-btn" data-route="accounts"><span data-icon="user"></span><span>Accounts</span></button>
        <button class="nav-btn" data-route="settings"><span data-icon="gear"></span><span>Settings</span></button>
      </nav>
      <div class="rail-foot">
        <button class="sky-chip" id="sky-chip" title="Sky — change in Settings"><span data-icon="sun" id="sky-icon"></span><span id="sky-label">Dawn</span></button>
        <div class="rail-version" id="rail-version">v0.2.0</div>
      </div>
    </aside>

    <main class="stage">
      <header class="topbar">
        <div class="crumb">
          <h1 id="page-title">Home</h1>
          <span id="page-sub" class="page-sub"></span>
        </div>
        <div class="topbar-right">
          <button class="pill" id="log-toggle" title="Game log (Ctrl+L)"><span data-icon="log"></span><span>Log</span><span class="pill-dot" id="log-dot" hidden></span></button>
          <button class="account-chip" id="account-chip"><canvas class="avatar" width="8" height="8" id="account-avatar"></canvas><span id="account-name">No account</span><span data-icon="chev"></span></button>
        </div>
      </header>
      <section id="page" class="page" aria-live="polite"></section>
    </main>
  </div>

  <section class="console" id="console" aria-label="Game log">
    <div class="console-head">
      <strong>Game log</strong>
      <select id="console-instance" aria-label="Instance"></select>
      <div class="seg" id="console-filter" role="group" aria-label="Filter">
        <button class="seg-btn on" data-level="all">All</button>
        <button class="seg-btn" data-level="warn">Warnings</button>
        <button class="seg-btn" data-level="error">Errors</button>
      </div>
      <input id="console-search" type="search" placeholder="Search log" aria-label="Search log">
      <span class="grow"></span>
      <button class="btn btn-sm" id="console-copy">Copy</button>
      <button class="btn btn-sm" id="console-clear">Clear</button>
      <button class="btn btn-sm btn-ghost" id="console-close" aria-label="Close log"><span data-icon="x"></span></button>
    </div>
    <div class="console-body" id="console-body"></div>
  </section>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal-root" id="modal-root"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <script type="module" src="js/app.js"></script>
</body>
</html>
