[workspace]
resolver = "2"
members = ["crates/vortex-core", "crates/vortex-cli", "crates/vortex-app"]

[workspace.package]
version = "0.6.1"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
vortex-core = { path = "crates/vortex-core" }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
