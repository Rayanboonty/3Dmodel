<title>Vortex Realm</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: an arena broadcast - a framed scoreboard bar, a podium stage under the lights, ladder lists below. */
:root {
  color-scheme: dark;
  --bg: #070A14;
  --bg-2: #0B1020;
  --panel: #0F1528;
  --panel-2: #131B33;
  --line: #1D2744;
  --line-2: #2A3762;
  --text: #ECEFF8;
  --muted: #8E98B6;
  --dim: #59638A;
  --ember: #FF3D1F;
  --ember-2: #FF7A1A;
  --amber: #FFB547;
  --accent: #FFB547;
  --gold: #FFC93C;
  --silver: #D3DAE6;
  --bronze: #DC8A4E;
  --good: #3DDC84;
  --bad: #FF5A5A;
  --f-display: "Pixelify Sans", "Courier New", ui-monospace, monospace;
  --f-body: "Outfit", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --f-ui: "Chakra Petch", "Outfit", ui-sans-serif, system-ui, sans-serif;
  --r: 14px;
  --wrap: 1180px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.55 var(--f-body); overflow-x: hidden;
  -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; border-radius: 6px; }
.pix { image-rendering: pixelated; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.page { position: relative; z-index: 1; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: var(--wrap); margin: 0 auto; }

/* ---------------------------------------------------------------- nav */
.navbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; padding-block: 14px 0; }
.nav { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 58px;
  --navA: 32%; --navB: 12px;
  background: color-mix(in srgb, var(--panel) var(--navA), transparent); border: 1px solid var(--line); border-radius: 16px;
  backdrop-filter: blur(var(--navB)) saturate(190%) brightness(1.05); -webkit-backdrop-filter: blur(var(--navB)) saturate(190%) brightness(1.05);
  border-color: rgba(255, 255, 255, .09); box-shadow: inset 0 1px 0 var(--top), inset 0 -1px 0 var(--lip), 0 18px 40px -24px #000;
  transition: box-shadow .3s; }
.nav.scrolled { box-shadow: inset 0 1px 0 var(--top), inset 0 -1px 0 var(--lip), 0 22px 50px -20px #000, 0 0 0 1px color-mix(in srgb, var(--ember) 18%, transparent); }
/* ---------------------------------------------------------------- liquid glass
   Every surface is a pane of glass over the ember field: a faint tint, the field behind it blurred and saturated, a
   bright rim where the light hits (it follows the pointer), a lit top edge and a darker lower lip for thickness. On
   Chromium the edges of the main controls also bend what is behind them like a lens (an SVG map made per element). */
@property --sheen { syntax: "<number>"; inherits: true; initial-value: 0; }
:root { --glass: color-mix(in srgb, var(--panel) 34%, transparent); --glass-btn: color-mix(in srgb, #ffffff 6%, color-mix(in srgb, var(--panel-2) 40%, transparent));
  --rim: rgba(255, 255, 255, .58); --rim-2: rgba(255, 255, 255, .14); --lip: rgba(0, 0, 0, .45); --top: rgba(255, 255, 255, .11); }
.glass, .card, .stage, .col, .search input { background-color: var(--glass) !important;
  backdrop-filter: blur(20px) saturate(190%) brightness(1.05); -webkit-backdrop-filter: blur(20px) saturate(190%) brightness(1.05); }
:where(.nav, .logo, .search, .stage, .card, .col, .band, .btn, .stat, .ipcard, .tstate) { position: relative; }
:where(.card, .col, .stage, .band, .stat, .ipcard, .search input) { box-shadow: inset 0 1px 0 var(--top), inset 0 -1px 0 var(--lip), 0 26px 50px -32px #000; }
:where(.mrow, .feed li, .row, .chip, .tile, .bm, .kit, .qb .tr) { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), inset 0 -1px 0 rgba(0, 0, 0, .3); }
/* the rim: a thin ring of light, brightest at the top left and wherever the pointer is */
:is(.nav, .logo, .search, .stage, .card:not(.rank), .col, .band, .btn, .stat, .ipcard)::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 1;
  background: radial-gradient(200px circle at var(--mx, 25%) var(--my, 0%), rgb(255 255 255 / calc(.18 + var(--sheen) * .62)), transparent 70%),
    linear-gradient(155deg, var(--rim) 0%, var(--rim-2) 20%, transparent 42%, transparent 64%, rgba(255, 255, 255, .06) 84%, rgba(255, 255, 255, .2) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  transition: --sheen .45s ease; }
.search { border-radius: 14px; }
.lit { --sheen: 1; }
/* buttons are small glass pills that squish when pressed */
.btn:not(.hot) { background: var(--glass-btn); backdrop-filter: blur(14px) saturate(180%); -webkit-backdrop-filter: blur(14px) saturate(180%);
  border-color: rgba(255, 255, 255, .1); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), inset 0 -1px 0 var(--lip), 0 10px 22px -14px #000; }
.btn { transition: transform .4s cubic-bezier(.2, 1.7, .4, 1), box-shadow .25s, border-color .2s, background .2s; }
.btn:hover { transform: translateY(-1px) scale(1.025); }
.btn:active { transform: scale(.94); transition-duration: .12s; }
.btn.hot::before { background: linear-gradient(180deg, rgba(255, 255, 255, .7), rgba(255, 255, 255, .08) 45%, rgba(255, 255, 255, .02) 70%, rgba(255, 210, 180, .35)); }
.stat, .ipcard { background: color-mix(in srgb, var(--bg-2) 40%, transparent); backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%);
  border-color: rgba(255, 255, 255, .08); }
.drawer, .toast { backdrop-filter: blur(22px) saturate(190%); -webkit-backdrop-filter: blur(22px) saturate(190%); }
.toast { background: color-mix(in srgb, var(--panel-2) 55%, transparent); box-shadow: inset 0 1px 0 var(--top), 0 18px 40px -16px #000; }
.reveal, .reveal-item { will-change: transform, filter, opacity; }
/* ---------------------------------------------------------------- live */
.livehead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.onair { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; border-radius: 99px; font: 700 12px/1 var(--f-ui); letter-spacing: 2px;
  color: #fff; background: linear-gradient(180deg, #FF4A2A, #C9200E); box-shadow: 0 0 22px -4px var(--ember); }
.onair i { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.updated { font: 600 12px/1 var(--f-ui); color: var(--dim); letter-spacing: 1px; }
.livegrid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; margin-top: 14px; }
.panel h3 { margin: 0 0 12px; display: flex; align-items: center; justify-content: space-between; font: 600 12px/1 var(--f-ui); letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); }
.panel h3 b { color: var(--text); font-size: 13px; letter-spacing: 1px; }
.mrow { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto minmax(0, 1fr) 62px; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 11px;
  background: color-mix(in srgb, var(--bg-2) 70%, transparent); border: 1px solid var(--line); margin-bottom: 7px; }
.mrow .side { display: flex; align-items: center; gap: 8px; min-width: 0; font: 600 14px/1.1 var(--f-body); }
.mrow .side.r { justify-content: flex-end; text-align: right; }
.mrow .side span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .side img { width: 26px; height: 26px; border-radius: 6px; flex: none; }
.mrow .sc { font: 700 20px/1 var(--f-ui); font-variant-numeric: tabular-nums; letter-spacing: 1px; padding: 0 6px; }
.mrow .sc em { color: var(--dim); font-style: normal; margin: 0 4px; }
.mrow .meta { text-align: right; font: 600 11.5px/1.3 var(--f-ui); color: var(--muted); font-variant-numeric: tabular-nums; }
.mrow .meta b { display: block; color: var(--amber); font-size: 10.5px; letter-spacing: 1px; }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.feed li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 11px; border-radius: 11px;
  background: color-mix(in srgb, var(--bg-2) 70%, transparent); border: 1px solid var(--line); font-size: 14px; }
.feed li > i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--amber)); box-shadow: 0 0 10px var(--c, var(--amber)); }
.feed li span { min-width: 0; } .feed li b { font-weight: 600; } .feed li small { color: var(--dim); font: 600 11.5px/1 var(--f-ui); white-space: nowrap; }
.feed li.up { border-color: color-mix(in srgb, var(--c) 45%, var(--line)); background: color-mix(in srgb, var(--c) 9%, var(--bg-2)); }
.qbars { display: grid; gap: 9px; }
.qb { display: grid; grid-template-columns: 26px 92px minmax(0, 1fr) 44px; gap: 10px; align-items: center; font: 600 13px/1 var(--f-ui); }
.qb .tr { height: 10px; border-radius: 10px; background: color-mix(in srgb, var(--line) 80%, transparent); overflow: hidden; display: flex; }
.qb .tr i { display: block; height: 100%; transition: width .8s cubic-bezier(.2, .8, .2, 1); }
.qb .tr i.p { background: linear-gradient(90deg, var(--ember), var(--amber)); } .qb .tr i.q { background: color-mix(in srgb, var(--amber) 35%, transparent); }
.qb .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.qb .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend { display: flex; gap: 14px; margin-top: 10px; font: 600 11.5px/1 var(--f-ui); color: var(--dim); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.marquee { margin-top: 14px; overflow: hidden; mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.marquee .track { display: flex; gap: 10px; width: max-content; animation: slide 40s linear infinite; }
.marquee:hover .track { animation-play-state: paused; }
@keyframes slide { to { transform: translateX(-50%); } }
.marquee .track.back { animation-direction: reverse; margin-top: 10px; }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 4px; border-radius: 99px; border: 1px solid var(--line); background: color-mix(in srgb, var(--bg-2) 75%, transparent);
  font: 600 13px/1 var(--f-body); white-space: nowrap; cursor: pointer; }
.chip img { width: 28px; height: 28px; border-radius: 50%; }
.chip small { color: var(--dim); font: 600 10.5px/1 var(--f-ui); letter-spacing: 1px; }
.nolive { color: var(--dim); padding: 16px; text-align: center; font-size: 14px; }
.nav .side { display: flex; gap: 6px; padding: 0 14px; align-items: center; min-width: 0; }
.nav .side.right { justify-content: flex-end; }
.nav a.link { display: inline-flex; align-items: center; gap: 8px; padding: 9px 13px; border-radius: 10px;
  font: 600 15px/1 var(--f-display); letter-spacing: .4px; color: var(--muted); position: relative; transition: color .2s, background .2s; }
.nav a.link svg { width: 16px; height: 16px; }
.nav a.link:hover { color: var(--text); background: var(--panel-2); }
.nav a.link.on { color: var(--ember-2); }
.nav a.link.on::before { content: ""; position: absolute; left: 12px; right: 12px; top: -1px; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, var(--ember), var(--amber)); box-shadow: 0 0 12px var(--ember); }
.logo { position: relative; margin-top: -12px; margin-bottom: -12px; padding: 8px 18px 10px; background: color-mix(in srgb, var(--bg-2) 55%, transparent);
  backdrop-filter: blur(16px) saturate(190%); -webkit-backdrop-filter: blur(16px) saturate(190%); border: 1px solid rgba(255, 255, 255, .1); border-radius: 14px; box-shadow: 0 0 0 6px var(--bg), 0 20px 40px -18px #000; display: block; text-align: center; }
.logo img { display: block; height: 58px; width: auto; margin: 0 auto; filter: drop-shadow(0 4px 10px #000a);
  transition: transform .35s cubic-bezier(.2, 1.6, .4, 1), filter .3s; }
.logo:hover img { transform: translateY(-2px) scale(1.06) rotate(-2deg); filter: drop-shadow(0 6px 16px color-mix(in srgb, var(--ember) 55%, transparent)); }
.logo .swoosh { display: block; height: 3px; margin: 7px auto 0; width: 78%; border-radius: 4px; transform: skewX(-22deg);
  background: linear-gradient(90deg, transparent, var(--ember) 20%, var(--amber) 60%, transparent); box-shadow: 0 0 14px var(--ember); }
.wordmark { display: block; font: 700 34px/1 var(--f-display); letter-spacing: 1px; background:
  linear-gradient(100deg, #fff 0%, #fff 30%, var(--amber) 42%, var(--ember-2) 55%, var(--ember) 70%, #fff 100%);
  background-size: 260% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer 7s ease-in-out infinite; text-shadow: none; }
@keyframes shimmer { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0 0; } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 10px;
  border: 1px solid var(--line-2); background: var(--panel-2); font: 600 14px/1 var(--f-ui); letter-spacing: .5px; cursor: pointer;
  transition: transform .15s, box-shadow .2s, border-color .2s, background .2s; white-space: nowrap; }
.btn:hover { border-color: var(--amber); transform: translateY(-1px); }
.btn svg { width: 16px; height: 16px; }
.btn.hot { border: 0; color: #fff; background: linear-gradient(180deg, #FF5A30, #D92A12); box-shadow: 0 8px 22px -8px var(--ember), inset 0 1px 0 #ffffff40; }
.btn.hot:hover { box-shadow: 0 10px 28px -6px var(--ember), inset 0 1px 0 #ffffff55; }
.burger { display: none; }

/* ---------------------------------------------------------------- search + strip */
.search { margin-top: 18px; position: relative; }
.search input { width: 100%; height: 52px; padding: 0 18px 0 50px; background: color-mix(in srgb, var(--panel) 90%, transparent);
  border: 1px solid var(--line); border-radius: 14px; outline: none; font-size: 16px; transition: border-color .2s, box-shadow .2s; }
.search input::placeholder { color: var(--dim); }
.search input:focus { border-color: var(--ember-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ember) 18%, transparent); }
.search svg { position: absolute; left: 18px; top: 50%; translate: 0 -50%; width: 18px; height: 18px; color: var(--dim); z-index: 2; pointer-events: none; }
.search .kbd { z-index: 2; }
.search .kbd { position: absolute; right: 14px; top: 50%; translate: 0 -50%; font: 600 11px/1 var(--f-ui); color: var(--dim);
  border: 1px solid var(--line-2); border-radius: 6px; padding: 5px 7px; }

main { padding-block: 22px 40px; min-height: 60vh; }
.stage { position: relative; background: radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--ember) 12%, transparent), transparent 55%),
  linear-gradient(180deg, color-mix(in srgb, var(--panel) 50%, transparent), color-mix(in srgb, var(--bg-2) 40%, transparent)); border: 1px solid var(--line);
  border-radius: 20px; overflow: hidden; }
.section { margin-top: 26px; }
.h { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.h h2 { margin: 0; font: 700 26px/1.1 var(--f-display); letter-spacing: .5px; text-wrap: balance; }
.h p { margin: 4px 0 0; color: var(--muted); }
.eyebrow { font: 600 12px/1 var(--f-ui); letter-spacing: 3px; text-transform: uppercase; color: var(--ember-2); }

/* ---------------------------------------------------------------- hero */
.hero { display: grid; grid-template-columns: 1.05fr .95fr; gap: 26px; align-items: center; padding: 34px 34px 30px; }
.hero h1 { margin: 10px 0 12px; font: 700 clamp(38px, 5.6vw, 64px)/.95 var(--f-display); letter-spacing: 1px; text-wrap: balance; }
.hero h1 .glow { background: linear-gradient(90deg, var(--amber), var(--ember-2), var(--ember)); -webkit-background-clip: text; background-clip: text;
  color: transparent; filter: drop-shadow(0 0 18px color-mix(in srgb, var(--ember) 45%, transparent)); }
.hero .lead { color: var(--muted); font-size: 17px; max-width: 52ch; margin: 0 0 20px; }
.ipcard { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px; border-radius: 14px; background: var(--bg-2);
  border: 1px solid var(--line-2); max-width: 520px; }
.ipcard .ip { font: 700 20px/1 var(--f-ui); letter-spacing: .6px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.ipcard .ip small { display: block; font: 600 11px/1 var(--f-ui); color: var(--dim); letter-spacing: 2px; margin-bottom: 6px; }
.live { display: inline-flex; align-items: center; gap: 8px; font: 600 13px/1 var(--f-ui); color: var(--good); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 var(--good); animation: ping 1.8s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
.cta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { padding: 16px; border-radius: 14px; background: color-mix(in srgb, var(--bg-2) 80%, transparent); border: 1px solid var(--line); }
.stat b { display: block; font: 700 30px/1 var(--f-ui); font-variant-numeric: tabular-nums; }
.stat span { font: 600 11px/1 var(--f-ui); letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.stat.hot b { color: var(--amber); }
/* the server logo floating over an ember glow, tilting toward the cursor */
.heroArt { position: relative; height: 330px; display: grid; place-items: center; perspective: 900px; isolation: isolate; }
.heroArt::before { content: ""; position: absolute; inset: 6% 8% 14%; z-index: -1; border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--amber) 42%, transparent), color-mix(in srgb, var(--ember) 22%, transparent) 55%, transparent 100%);
  filter: blur(18px); animation: glowPulse 5s ease-in-out infinite; }
.heroArt::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 6%; height: 22px; z-index: -1; border-radius: 50%;
  background: radial-gradient(closest-side, #000c, transparent); animation: shadow 5s ease-in-out infinite; }
.heroArt .tilt { position: relative; width: min(100%, 440px); transform-style: preserve-3d; transition: transform .25s ease-out; will-change: transform;
  --tx: 0; --ty: 0; }
/* the logo melts into the scene: a big blurred glow of itself behind, a sharp copy that fades out at the edges, and a
   blurred copy that only shows in a band along the edges - no hard cut where the picture ends */
.heroArt .float { position: relative; isolation: isolate; animation: bob 5s ease-in-out infinite; }
.heroArt .amb { z-index: -1; } .heroArt .soft { z-index: 1; } .heroArt .shine { z-index: 2; } .heroArt .spark { z-index: 3; }
.heroArt .float img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; pointer-events: none; }
.heroArt .float img + img, .heroArt .float .amb { position: absolute; inset: 0; }
.heroArt .amb { filter: blur(34px) saturate(1.7); opacity: .6; transform: translate(calc(var(--tx) * -14px), calc(var(--ty) * -10px)) scale(1.14); }
.heroArt .soft { filter: blur(6px) saturate(1.2); opacity: .9; }
.heroArt .soft.x { -webkit-mask: linear-gradient(90deg, transparent 0, #000 3%, #000 9%, transparent 15%, transparent 85%, #000 91%, #000 97%, transparent 100%),
    linear-gradient(180deg, transparent 0, #000 5%, #000 95%, transparent 100%); -webkit-mask-composite: source-in;
  mask: linear-gradient(90deg, transparent 0, #000 3%, #000 9%, transparent 15%, transparent 85%, #000 91%, #000 97%, transparent 100%),
    linear-gradient(180deg, transparent 0, #000 5%, #000 95%, transparent 100%); mask-composite: intersect; }
.heroArt .soft.y { -webkit-mask: linear-gradient(180deg, transparent 0, #000 3%, #000 8%, transparent 13%, transparent 86%, #000 91%, #000 97%, transparent 100%),
    linear-gradient(90deg, transparent 0, #000 5%, #000 95%, transparent 100%); -webkit-mask-composite: source-in;
  mask: linear-gradient(180deg, transparent 0, #000 3%, #000 8%, transparent 13%, transparent 86%, #000 91%, #000 97%, transparent 100%),
    linear-gradient(90deg, transparent 0, #000 5%, #000 95%, transparent 100%); mask-composite: intersect; }
.heroArt .main { filter: drop-shadow(0 18px 26px #000b) drop-shadow(0 0 30px color-mix(in srgb, var(--ember) 30%, transparent));
  -webkit-mask: linear-gradient(90deg, transparent 1%, #000 12%, #000 88%, transparent 99%), linear-gradient(180deg, transparent 1%, #000 9%, #000 89%, transparent 99%);
  -webkit-mask-composite: source-in;
  mask: linear-gradient(90deg, transparent 1%, #000 12%, #000 88%, transparent 99%), linear-gradient(180deg, transparent 1%, #000 9%, #000 89%, transparent 99%);
  mask-composite: intersect; }
.heroArt .shine { position: absolute; inset: 0; pointer-events: none; -webkit-mask: url(logo.png) center / 100% 100% no-repeat; mask: url(logo.png) center / 100% 100% no-repeat;
  background: linear-gradient(105deg, transparent 38%, #ffffff50 48%, #ffffff10 54%, transparent 62%) -160% 0 / 250% 100% no-repeat;
  animation: sweep 6.5s ease-in-out 1.2s infinite; mix-blend-mode: screen; }
/* a few embers drifting up out of the logo */
.heroArt .spark { position: absolute; bottom: 22%; width: 4px; height: 4px; border-radius: 1px; background: var(--amber); box-shadow: 0 0 8px var(--ember-2);
  opacity: 0; animation: spark 3.6s ease-out infinite; }
@keyframes spark { 0% { opacity: 0; translate: 0 0; } 15% { opacity: .9; } 100% { opacity: 0; translate: var(--dx, 10px) -150px; } }
@keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -12px; } }
@keyframes glowPulse { 0%, 100% { opacity: .75; scale: 1; } 50% { opacity: 1; scale: 1.06; } }
@keyframes shadow { 0%, 100% { opacity: .9; scale: 1; } 50% { opacity: .55; scale: .82; } }
@keyframes sweep { 0%, 55% { background-position: -160% 0; } 100% { background-position: 260% 0; } }

/* ---------------------------------------------------------------- podium */
.podium { position: relative; padding: 26px 18px 0; }
.podium .title { text-align: center; font: 700 34px/1 var(--f-display); color: var(--gold); letter-spacing: .5px; margin: 0;
  text-shadow: 0 0 22px color-mix(in srgb, var(--gold) 55%, transparent); }
.podium .kitname { text-align: center; color: var(--muted); font: 600 12px/1 var(--f-ui); letter-spacing: 3px; margin-top: 10px; text-transform: uppercase; }
.laurel { position: absolute; top: 60px; width: 170px; height: 260px; opacity: .85; pointer-events: none; }
.laurel.l { left: max(2%, calc(50% - 470px)); }
.laurel.r { right: max(2%, calc(50% - 470px)); transform: scaleX(-1); }
.steps { display: flex; justify-content: center; align-items: flex-end; gap: 22px; padding: 26px 0 0; perspective: 900px; }
.step { position: relative; width: 190px; border-radius: 16px 16px 0 0; border: 1px solid var(--line-2); border-bottom: 0; overflow: hidden;
  background: linear-gradient(180deg, #05070D, #0A0F1E 55%, var(--panel)); transform-style: preserve-3d; cursor: pointer;
  transition: border-color .25s, box-shadow .25s; }
.step:hover { border-color: var(--c); box-shadow: 0 0 0 1px var(--c), 0 18px 50px -20px var(--c); }
.step .nm { text-align: center; font: 600 19px/1.1 var(--f-display); padding: 16px 10px 0; color: var(--c); overflow-wrap: anywhere; }
.step .who { display: flex; gap: 6px; justify-content: center; align-items: center; margin-top: 6px; min-height: 20px; }
.step .skin { display: block; margin: 8px auto 0; height: 150px; width: auto; filter: drop-shadow(0 10px 18px #000); transition: transform .35s; }
.step:hover .skin { transform: translateY(-6px) scale(1.04); }
.step .base { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 700 64px/1 var(--f-ui); color: var(--c);
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 34%, transparent), color-mix(in srgb, var(--c) 6%, transparent));
  border-top: 1px solid color-mix(in srgb, var(--c) 55%, transparent); text-shadow: 0 0 26px color-mix(in srgb, var(--c) 70%, transparent); }
.step .pts { font: 600 12px/1 var(--f-ui); color: var(--muted); letter-spacing: 1px; text-shadow: none; }
.step.p1 { --c: var(--gold); width: 210px; } .step.p1 .base { height: 132px; } .step.p1 .skin { height: 172px; }
.step.p2 { --c: var(--silver); } .step.p2 .base { height: 100px; }
.step.p3 { --c: var(--bronze); } .step.p3 .base { height: 84px; font-size: 54px; } .step.p3 .skin { height: 138px; }
.step.p1::after { content: ""; position: absolute; inset: -40% -10% auto; height: 70%; background: radial-gradient(closest-side, color-mix(in srgb, var(--gold) 26%, transparent), transparent);
  pointer-events: none; animation: breathe 3.2s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .45; } }
.divider { height: 1px; margin: 0 auto; width: min(680px, 92%); background: linear-gradient(90deg, transparent, var(--line-2), transparent); }

/* ---------------------------------------------------------------- ladder rows */
.ladder { display: grid; gap: 10px; padding: 18px; max-width: 760px; margin: 0 auto; }
.row { display: grid; grid-template-columns: 52px 46px 1fr auto; gap: 14px; align-items: center; padding: 10px 16px; border-radius: 12px;
  background: color-mix(in srgb, var(--bg-2) 92%, transparent); border: 1px solid var(--line); cursor: pointer; transition: transform .2s, border-color .2s, background .2s; }
.row:hover { transform: translateX(4px); border-color: var(--line-2); background: var(--panel-2); }
.row .pos { font: 700 22px/1 var(--f-ui); color: var(--dim); text-align: center; font-variant-numeric: tabular-nums; }
.row img.head { width: 40px; height: 40px; border-radius: 8px; }
.row .name { display: flex; align-items: center; gap: 8px; min-width: 0; font: 600 16px/1.2 var(--f-body); }
.row .name span.n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .right { display: flex; gap: 12px; align-items: center; font: 600 13px/1 var(--f-ui); color: var(--muted); font-variant-numeric: tabular-nums; }
.row .right b { color: var(--text); font-weight: 700; }
.wl { display: inline-flex; align-items: center; gap: 8px; }
.wl .bar { width: 70px; height: 6px; border-radius: 6px; background: color-mix(in srgb, var(--bad) 55%, transparent); overflow: hidden; }
.wl .bar i { display: block; height: 100%; background: var(--good); }

/* ---------------------------------------------------------------- chips */
.tier { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font: 700 12px/1 var(--f-ui); letter-spacing: .5px;
  color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }
.rtag { display: inline-flex; align-items: center; height: 19px; padding: 0 7px; border-radius: 5px; font: 800 10.5px/1 var(--f-ui); letter-spacing: .8px; color: #fff;
  text-shadow: 0 1px 0 #0006; }
.flag { width: 20px; height: 14px; border-radius: 3px; object-fit: cover; box-shadow: 0 0 0 1px #0007; }
.cc { display: inline-grid; place-items: center; height: 15px; padding: 0 4px; border-radius: 3px; font: 700 9.5px/1 var(--f-ui); color: var(--muted); background: var(--line); }
.vf { width: 15px; height: 15px; flex: none; }
.kits { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: thin; }
.kit { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 8px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--panel); cursor: pointer; font: 600 14px/1 var(--f-ui); color: var(--muted); white-space: nowrap; transition: all .2s; }
.kit:hover { color: var(--text); border-color: var(--line-2); }
.kit.on { color: #fff; border-color: color-mix(in srgb, var(--k) 70%, transparent); background: color-mix(in srgb, var(--k) 16%, var(--panel));
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--k) 35%, transparent), 0 10px 24px -14px var(--k); }
.ico { width: 26px; height: 26px; display: inline-grid; place-items: center; flex: none; }
.ico img { width: 24px; height: 24px; image-rendering: pixelated; }
.ico .let { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; font: 700 12px/1 var(--f-display); color: #0b0f1d; background: var(--k); }

/* ---------------------------------------------------------------- cards / grids */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.mode { position: relative; overflow: hidden; transition: transform .25s, border-color .25s; }
.mode:hover { transform: translateY(-3px); border-color: var(--line-2); }
.mode .top { display: flex; align-items: center; gap: 12px; }
.mode .ico { width: 46px; height: 46px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); }
.mode .ico img { width: 30px; height: 30px; }
.mode h3 { margin: 0; font: 700 19px/1.1 var(--f-display); letter-spacing: .5px; }
.mode p { color: var(--muted); margin: 12px 0 14px; font-size: 14.5px; }
.mode .foot { display: flex; justify-content: space-between; align-items: center; font: 600 13px/1 var(--f-ui); }
.status { display: inline-flex; align-items: center; gap: 6px; color: var(--good); }

.mode::after { content: ""; position: absolute; right: -40px; top: -40px; width: 120px; height: 120px; border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--ember) 18%, transparent), transparent); }
.news { display: grid; gap: 8px; }
.news time { font: 600 12px/1 var(--f-ui); letter-spacing: 1.5px; color: var(--ember-2); }
.news h3 { margin: 0; font: 600 18px/1.25 var(--f-body); }
.news p { margin: 0; color: var(--muted); font-size: 14.5px; }
.band { margin-top: 26px; display: flex; gap: 18px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 26px 28px;
  border-radius: 18px; border: 1px solid color-mix(in srgb, var(--ember) 40%, var(--line)); background:
  radial-gradient(80% 140% at 0% 0%, color-mix(in srgb, var(--ember) 22%, transparent), transparent 60%), var(--panel); }
.band h3 { margin: 0; font: 700 24px/1.15 var(--f-display); text-wrap: balance; }
.band p { margin: 6px 0 0; color: var(--muted); }

/* ---------------------------------------------------------------- tier board */
.board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.col { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; }
.col header { padding: 14px; text-align: center; border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 22%, transparent), transparent); }
.col header b { display: block; font: 700 22px/1 var(--f-ui); letter-spacing: 1px; text-transform: uppercase; color: var(--c); }
.col header span { font: 600 11px/1 var(--f-ui); letter-spacing: 2px; color: var(--muted); }
.col ul { list-style: none; margin: 0; padding: 8px; display: grid; gap: 6px; }
.col li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 9px; background: var(--bg-2); cursor: pointer; min-width: 0;
  border: 1px solid transparent; transition: border-color .2s; }
.col li:hover { border-color: var(--line-2); }
.col li img { width: 24px; height: 24px; border-radius: 5px; }
.col li .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 14px/1 var(--f-body); }
.col li .s { font: 700 10.5px/1 var(--f-ui); padding: 3px 5px; border-radius: 4px; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.col .none { padding: 18px; text-align: center; color: var(--dim); font-size: 13px; }

/* ---------------------------------------------------------------- ranks */
.ranks { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.rank { position: relative; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
.rank::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: linear-gradient(90deg, var(--a), var(--b)); }
.rank .label { font: 700 26px/1 var(--f-display); letter-spacing: 1px; background: linear-gradient(90deg, var(--a), var(--b));
  -webkit-background-clip: text; background-clip: text; color: transparent; }
.rank .price { font: 700 30px/1 var(--f-ui); }
.rank .price small { font-size: 13px; color: var(--muted); font-weight: 600; }
.rank ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; color: var(--muted); font-size: 14.5px; }
.rank li { display: flex; gap: 8px; align-items: flex-start; }
.rank li svg { width: 16px; height: 16px; flex: none; margin-top: 3px; color: var(--b); }
.rank .btn { margin-top: auto; }

/* ---------------------------------------------------------------- staff / rules */
.staff { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.member { display: flex; align-items: center; gap: 12px; cursor: pointer; transition: border-color .2s; }
.member:hover { border-color: var(--line-2); }
.member img { width: 46px; height: 46px; border-radius: 10px; }
.member b { display: block; font: 600 16px/1.2 var(--f-body); overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); display: inline-block; }
.dot.on { background: var(--good); box-shadow: 0 0 8px var(--good); }
.rules { display: grid; gap: 10px; max-width: 860px; }
.rule { display: grid; grid-template-columns: 48px 1fr; gap: 14px; align-items: start; }
.rule .num { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 11px; font: 700 18px/1 var(--f-ui);
  color: var(--ember-2); background: color-mix(in srgb, var(--ember) 12%, transparent); border: 1px solid color-mix(in srgb, var(--ember) 30%, transparent); }
.rule h3 { margin: 2px 0 4px; font: 600 17px/1.3 var(--f-body); }
.rule p { margin: 0; color: var(--muted); }

/* ---------------------------------------------------------------- profile */
.profile { display: grid; grid-template-columns: 300px 1fr; gap: 18px; }
.viewer { position: relative; min-height: 380px; display: grid; place-items: center; background: radial-gradient(70% 60% at 50% 40%, color-mix(in srgb, var(--ember) 16%, transparent), transparent), var(--panel); }

.viewer .hint { position: absolute; bottom: 10px; font: 600 11px/1 var(--f-ui); color: var(--dim); letter-spacing: 1.5px; }
.pname { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pname h2 { margin: 0; font: 700 34px/1 var(--f-display); letter-spacing: .5px; overflow-wrap: anywhere; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
.tile { padding: 14px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); min-width: 0; }
.tile b { display: block; font: 700 22px/1.1 var(--f-ui); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile span { font: 600 11px/1 var(--f-ui); color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; }
.kitstats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); margin-top: 16px; }
.ks { display: grid; gap: 10px; }
.ks .top { display: flex; align-items: center; gap: 10px; }
.ks .top b { font: 700 17px/1 var(--f-display); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ks .pts { font: 700 24px/1 var(--f-ui); font-variant-numeric: tabular-nums; }

.ks .meta { display: flex; justify-content: space-between; font: 600 12.5px/1 var(--f-ui); color: var(--muted); }
.meter { height: 7px; border-radius: 7px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 7px; background: linear-gradient(90deg, var(--ember), var(--amber)); }
.empty { padding: 34px; text-align: center; color: var(--muted); }
.skeleton { background: linear-gradient(90deg, var(--panel) 0%, var(--panel-2) 50%, var(--panel) 100%); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: 12px; }
@keyframes sk { to { background-position: -200% 0; } }

/* ---------------------------------------------------------------- footer + toast */
footer { position: relative; z-index: 1; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--bg-2) 85%, transparent); }
.foot { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 24px; padding-block: 34px 18px; }
.foot h4 { margin: 0 0 10px; font: 600 12px/1 var(--f-ui); letter-spacing: 2.5px; color: var(--muted); text-transform: uppercase; }
.foot a { display: block; color: var(--muted); padding: 4px 0; font-size: 15px; } .foot a:hover { color: var(--text); }
.legal { padding-block: 14px 26px; color: var(--dim); font-size: 13px; border-top: 1px solid var(--line); }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); translate: -50% 20px; z-index: 50; padding: 12px 18px; border-radius: 12px;
  background: var(--panel-2); border: 1px solid var(--line-2); font: 600 14px/1 var(--f-ui); opacity: 0; transition: opacity .25s, translate .25s; pointer-events: none; }
.toast.on { opacity: 1; translate: -50% 0; }

/* ---------------------------------------------------------------- tournaments */
.tour { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 20px; align-items: center; padding: 24px 26px; }
.tour .trophy { width: 72px; height: 72px; display: grid; place-items: center; border-radius: 18px;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--gold) 34%, transparent), transparent), var(--bg-2); border: 1px solid color-mix(in srgb, var(--gold) 40%, var(--line)); }
.tour .trophy .ico, .tour .trophy .ico img { width: 44px; height: 44px; }
.tour h3 { margin: 8px 0 4px; font: 700 30px/1.05 var(--f-display); letter-spacing: .5px; text-wrap: balance; }
.tour p { margin: 0; color: var(--muted); } .tour .st { margin-top: 6px; color: var(--text); font: 600 14px/1.3 var(--f-ui); }
.tour .prize { color: var(--gold); }
.tstate { display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 10px; border-radius: 99px; font: 700 11px/1 var(--f-ui); letter-spacing: 1.6px; text-transform: uppercase;
  color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.tstate i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: blink 1.2s infinite; }
.tstate.live { color: #fff; background: linear-gradient(180deg, #FF4A2A, #C9200E); } .tstate.done { color: var(--muted); background: var(--panel-2); } .tstate.done i { animation: none; }
.tnum { text-align: right; display: grid; justify-items: end; }
.tnum b { font: 700 34px/1 var(--f-ui); font-variant-numeric: tabular-nums; } .tnum b.cd { color: var(--amber); margin-top: 10px; font-size: 26px; }
.tnum span { font: 600 11px/1 var(--f-ui); letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.tour.none { grid-template-columns: auto minmax(0, 1fr) auto; }
.bwrap { padding: 14px 6px 6px; }
.bracket { display: flex; gap: 30px; overflow-x: auto; padding: 4px 12px 14px; scrollbar-width: thin; }
.bcol { display: flex; flex-direction: column; justify-content: space-around; gap: 16px; min-width: 220px; flex: 1 0 220px; }
.bcol h4 { margin: 0 0 2px; font: 600 11.5px/1 var(--f-ui); letter-spacing: 2.4px; text-transform: uppercase; color: var(--ember-2); text-align: center; }
.bm { position: relative; border: 1px solid var(--line); border-radius: 12px; background: color-mix(in srgb, var(--bg-2) 80%, transparent); }
.bcol:not(:last-child) .bm::after { content: ""; position: absolute; left: 100%; top: 50%; width: 15px; border-top: 1px solid var(--line-2); }
.bcol:not(:first-child) .bm::before { content: ""; position: absolute; right: 100%; top: 50%; width: 15px; border-top: 1px solid var(--line-2); }
.bm .p { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 9px; align-items: center; padding: 8px 11px; font: 600 14px/1.1 var(--f-body); }
.bm .p + .p { border-top: 1px solid var(--line); }
.bm .p img.head, .bm .p .hd { width: 26px; height: 26px; border-radius: 6px; background: var(--line); }
.bm .p span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bm .p .s { font: 700 16px/1 var(--f-ui); font-variant-numeric: tabular-nums; color: var(--muted); }
.bm .p.win { background: linear-gradient(90deg, color-mix(in srgb, var(--good) 16%, transparent), transparent); } .bm .p.win .s { color: var(--good); }
.bm .p.lose { opacity: .55; } .bm .p.lose span { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--bad) 70%, transparent); }
.bm.bye .p:last-child { color: var(--dim); font-style: italic; }
.bm.bmlive { border-color: color-mix(in srgb, var(--ember) 65%, var(--line)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--ember) 30%, transparent), 0 10px 30px -12px var(--ember); }
.bm .lv { position: absolute; top: -9px; left: 50%; translate: -50% 0; display: inline-flex; align-items: center; gap: 5px; height: 18px; padding: 0 8px; border-radius: 99px;
  font: 700 9.5px/1 var(--f-ui); letter-spacing: 1.4px; color: #fff; background: linear-gradient(180deg, #FF4A2A, #C9200E); z-index: 1; }
.bm .lv i { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: blink 1.2s infinite; }
.bm.cup { display: grid; justify-items: center; gap: 8px; padding: 16px; border-color: color-mix(in srgb, var(--gold) 55%, var(--line));
  background: radial-gradient(closest-side, color-mix(in srgb, var(--gold) 20%, transparent), transparent), var(--bg-2); font: 700 17px/1 var(--f-display); color: var(--gold); }
.bm.cup img.head { width: 48px; height: 48px; border-radius: 10px; }
.stand { padding: 0; overflow-x: auto; }
.stand table { width: 100%; border-collapse: collapse; min-width: 420px; }
.stand th { text-align: left; font: 600 11px/1 var(--f-ui); letter-spacing: 1.8px; text-transform: uppercase; color: var(--muted); padding: 12px 14px; border-bottom: 1px solid var(--line); }
.stand td { padding: 9px 14px; border-bottom: 1px solid var(--line); font: 600 14px/1 var(--f-ui); font-variant-numeric: tabular-nums; }
.stand tr { cursor: pointer; } .stand tr:hover td { background: var(--panel-2); }
.stand tr.in td:first-child { color: var(--good); box-shadow: inset 3px 0 0 var(--good); }
.stand tr.cut td { border-bottom: 1px dashed color-mix(in srgb, var(--good) 60%, transparent); }
.stand .who { display: flex; align-items: center; gap: 10px; font-family: var(--f-body); } .stand .who img { width: 28px; height: 28px; border-radius: 6px; }
.tres em { font-style: normal; color: var(--good); font: 700 13px/1 var(--f-ui); margin-left: 4px; }
.champcard { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: center; cursor: pointer; transition: transform .2s, border-color .2s; }

.champcard img.head { width: 56px; height: 56px; border-radius: 12px; }

let liveTimer = 0, liveSeen = new Set();

        const next = k.tier && k.tier.index >= 0 && k.tier.index < 14 ? THRESH[k.tier.index + 1] : null, cur = k.tier && k.tier.index >= 0 ? THRESH[k.tier.index] : 0;
        const prog = next ? Math.max(0, Math.min(100, (k.elo - cur) / (next - cur) * 100)) : 100;
        return `<div class="card ks"><div class="top">${ICON((kits.find(x => x.id === k.id) || {}).icon || "paper", k.color)}<b>${esc(k.name)}</b>${TIER(k.tier)}</div>
          <div class="pts">${Number(k.elo).toLocaleString()} <small>pts${k.position > 0 ? " · #" + k.position : ""}</small></div>
          <div class="meter" title="${next ? "To the next tier" : "Top tier"}"><i style="width:${prog}%"></i></div>
          <div class="meta"><span>${k.wins}W ${k.losses}L · ${wr}%</span><span>Best streak ${k.bestStreak}</span></div></div>`; }).join("") || `<div class="card empty">No matches yet.</div>`}</div>
    </div></div>`;
  enter(".profile > *", {s: .1, y: 20}); enter(".ks", {delay: .2, s: .05});
  if (G()) view.querySelectorAll(".meter i").forEach(m => G().from(m, {width: 0, duration: 1.1, ease: "power3.out", delay: .35}));
  skin3d(p.name);
}
/* the 3D skin: skinview3d with the player's real skin; their 2D render stays if anything is missing */
function skin3d(name) {
  if (DEMO) return;
  const host = $("#viewer"); if (!host) return;
  const start = () => {
    if (!window.skinview3d) return;
    const img = new Image(); img.crossOrigin = "anonymous";
    img.onload = () => {
      try {
        const cv = document.createElement("canvas");
        const w = Math.min(300, host.clientWidth - 20);
        const v = new window.skinview3d.SkinViewer({canvas: cv, width: w, height: 360, skin: img});
        v.animation = new window.skinview3d.WalkingAnimation(); v.animation.speed = .55; v.autoRotate = !REDUCED; v.autoRotateSpeed = .6; v.zoom = .85;
        const old = host.querySelector("img"); if (old) old.remove(); host.prepend(cv);
      } catch (e) { /* keep the 2D render */ }
    };
    img.src = "https://mc-heads.net/skin/" + encodeURIComponent(name);
  };
  if (window.skinview3d) start();
  else { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/skinview3d@3.1.0/bundles/skinview3d.bundle.js"; s.onload = start; document.head.appendChild(s); }
}

/* ---------------------------------------------------------------- hero logo + ember field */
/* the logo leans toward the cursor; it pops in once with a little bounce */
function heroLogo() {
  const box = $("#heroArt"), tilt = $("#heroTilt"); if (!box || !tilt) return;
  // it materialises: out of a blur, a little small, then settles with a soft overshoot
  const gs = G(); if (gs) gs.timeline({delay: .1})
    .from(tilt, {scale: .78, opacity: 0, filter: "blur(18px)", duration: 1.15, ease: "expo.out", clearProps: "scale,opacity,filter"})
    .from(tilt.querySelector(".amb"), {opacity: 0, duration: 1.4, ease: "power2.out", clearProps: "opacity"}, "<.2");
  if (REDUCED || matchMedia("(hover: none)").matches) return;
  const hero = box.closest(".hero");
  hero.addEventListener("pointermove", e => {
    const r = box.getBoundingClientRect(), x = Math.max(-1, Math.min(1, (e.clientX - r.left) / r.width - .5)), y = Math.max(-1, Math.min(1, (e.clientY - r.top) / r.height - .5));
    tilt.style.transform = `rotateY(${x * 14}deg) rotateX(${y * -10}deg)`;
    // the glow behind drifts the other way: depth
    tilt.style.setProperty("--tx", x.toFixed(3)); tilt.style.setProperty("--ty", y.toFixed(3));
  });
  hero.addEventListener("pointerleave", () => { tilt.style.transform = ""; tilt.style.setProperty("--tx", 0); tilt.style.setProperty("--ty", 0); });
}
(function embers() {
  const cv = $("#fx"), g = cv.getContext("2d"); let w, h; const N = REDUCED ? 0 : 70;
  const ps = Array.from({length: N}, () => ({x: Math.random(), y: Math.random(), v: .0004 + Math.random() * .0012, s: .6 + Math.random() * 1.8, f: Math.random() * 6}));
  const size = () => { const d = devicePixelRatio || 1; w = innerWidth; h = innerHeight; cv.width = w * d; cv.height = h * d; g.setTransform(d, 0, 0, d, 0, 0); };
  size(); addEventListener("resize", size);
  const draw = () => {
    g.clearRect(0, 0, w, h);
    const v = g.createRadialGradient(w / 2, -h * .1, 0, w / 2, -h * .1, h * .9); v.addColorStop(0, "rgba(255,61,31,.10)"); v.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = v; g.fillRect(0, 0, w, h);
    // slow glowing blobs behind the frosted panels (the glass blurs them live)
    const tt = performance.now() / 1000;
    for (let b = 0; b < 3; b++) {
      const bx = w * (.2 + .6 * (.5 + .5 * Math.sin(tt * .07 + b * 2.1))), by = h * (.25 + .5 * (.5 + .5 * Math.cos(tt * .05 + b * 1.7))), br = Math.min(w, h) * (.28 + b * .06);
      const bg = g.createRadialGradient(bx, by, 0, bx, by, br);
      bg.addColorStop(0, b === 1 ? "rgba(255,181,71,.10)" : "rgba(255,61,31,.13)"); bg.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = bg; g.fillRect(0, 0, w, h);
    }
    for (const p of ps) {
      p.y -= p.v; p.f += .02; if (p.y < -.02) { p.y = 1.02; p.x = Math.random(); }
      const x = (p.x + Math.sin(p.f) * .006) * w, y = p.y * h, a = Math.min(1, (1 - p.y) * 1.4) * .55;
      g.fillStyle = `rgba(255,${120 + Math.round(Math.sin(p.f) * 40)},40,${a})`; g.fillRect(x, y, p.s, p.s);
    }
    if (N) requestAnimationFrame(draw);
  };
  draw();
})();

/* ---------------------------------------------------------------- routing */
async function route() {
  const hsh = location.hash.slice(1);
  let page = hsh.startsWith("p-") ? "player" : (NAMES[hsh] ? hsh : "home");
  if (page !== "home" && page !== "player" && !(site.pages || []).includes(page)) page = "home";
  markNav(page); $("#drawer").hidden = true; killReveals();
  if (hsh && page !== "player") scrollTo({top: 0, behavior: REDUCED ? "auto" : "smooth"});
  try {
    if (page === "player") await player(decodeURIComponent(hsh.slice(2)));
    else await ({home, modes, leaderboards, tiers, tournaments, ranks, staff, rules})[page]();
  } catch (e) { view.innerHTML = `<div class="card empty">This page couldn't load. Try again in a moment.</div>`; }
  const gs = G(); if (gs) gs.from(view, {opacity: .5, y: 8, duration: .35, ease: "power2.out", clearProps: "opacity,transform"});
  settle();
  // lenses once the entrance has settled (sizes are final)
  setTimeout(lensAll, 700);
}
/* if the animation clock doesn't run (background tab, preview capture), finish every entrance so nothing stays half-shown;
   scroll-driven tweens (the hero blur) follow the scrollbar and are left alone, or the hero would blur by itself */
function settle() {
  clearTimeout(settle.t);
  settle.t = setTimeout(() => { const gs = window.gsap; if (gs) gs.globalTimeline.getChildren(true, true, false).forEach(tw => { if (!tw.scrollTrigger && tw.progress() < 1) tw.progress(1); }); }, 2400);
}
$("#searchForm").addEventListener("submit", e => { e.preventDefault(); const q = $("#q").value.trim(); if (/^[A-Za-z0-9_]{1,16}$/.test(q)) { $("#q").blur(); open(q); } else toast("Type a Minecraft name (letters, numbers, _)"); });
addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); } });
$("#playBtn").onclick = copyIp;
$("#footIp").onclick = e => { e.preventDefault(); copyIp(); };
$("#burger").onclick = () => { $("#drawer").hidden = !$("#drawer").hidden; };
$("#drawer").addEventListener("click", e => { if (e.target === $("#drawer")) $("#drawer").hidden = true; });
addEventListener("hashchange", route);

(async () => {
  site = await api("/api/site");
  if (!site || !site.name) { DEMO = true; site = demo("/api/site"); }
  kits = await api("/api/kits") || [];
  applySite();
  const gs = G(); if (gs) gs.from(".nav, .search", {y: -16, opacity: .4, duration: .7, ease: "power3.out", stagger: .08, clearProps: "opacity,transform"});
  await route();
})();
/* a preview capture or a hidden tab never runs the animation clock: then everything is shown finished and nothing waits for a scroll */
(function watchClock() {
  let frames = 0; const t0 = performance.now();
  const f = () => { frames++; if (performance.now() - t0 < 1500) requestAnimationFrame(f); };
  requestAnimationFrame(f);
  setTimeout(() => {
    if (frames > 8) return;
    animClockOk = false;
    const gs = window.gsap; if (!gs) return;
    if (window.ScrollTrigger) window.ScrollTrigger.getAll().forEach(t => t.kill());
    gs.globalTimeline.getChildren(true, true, false).forEach(tw => tw.progress(1));
    gs.set(".reveal, .reveal-item, .hero, .grid > *", {clearProps: "filter,transform,opacity"});
  }, 1700);
})();
